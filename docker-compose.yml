version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: archive_fqp
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/01_backup.sql
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  archivefqp:
    image: ${DOCKER_REGISTRY-}archivefqp
    build:
      context: .
      dockerfile: ArchiveFqp/ArchiveFqp/Dockerfile
    container_name: blazor_app
    environment:
      # Подключение к БД
      ConnectionStrings__ArchiveFqpContext: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      # URL AI Extractor (внутренний)
      AiExtractor__BaseUrl: http://ai-extractor:8002
      # ThreeKl (OAuth)
      ThreeKl__ClientId: ${THREEKL_CLIENT_ID:-}
      ThreeKl__ClientSecret: ${THREEKL_CLIENT_SECRET:-}
      ThreeKl__AuthorizationEndpoint: ${THREEKL_AUTH_ENDPOINT:-https://3kl.example.com/local/oauth/login.php}
      ThreeKl__TokenEndpoint: ${THREEKL_TOKEN_ENDPOINT:-https://3kl.example.com/local/oauth/token.php}
      ThreeKl__UserInfoEndpoint: ${THREEKL_USERINFO_ENDPOINT:-https://3kl.example.com/local/oauth/user_info.php}
      ThreeKl__RedirectUri: ${THREEKL_REDIRECT_URI:-https://your-domain.com/signin-3kl}
      # SmtpSettings
      SmtpSettings__Server: ${SMTP_SERVER:-smtp.your-provider.com}
      SmtpSettings__Port: ${SMTP_PORT:-587}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME:-Ваше Имя}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-from@example.com}
      SmtpSettings__Username: ${SMTP_USERNAME:-your_login}
      SmtpSettings__Password: ${SMTP_PASSWORD:-your_app_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # для продакшна
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro # Монтируем папку с SSL-файлами
  #   depends_on:
  #     - archivefqp

  # ============================================
  # Ollama (опционально — в контейнере)
